name: ACA – Deploy (reusable)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ACR:
        default: "pappcr"
        required: false
        type: string
      PROJECT_NAME:
        default: "pbe"
        required: false
        type: string
      IMAGE_NAME:
        required: true
        type: string
      ENV:
        required: true
        type: string
      ACA:
        required: true
        type: string
      ACA_RESOURCE_GROUP:
        required: true
        type: string
      DOCKERFILE:
        required: true
        type: string
      DEPLOY_TO_PILOT:
        required: false
        default: true
        type: boolean
      PROMOTE_TO_MAIN:
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TEAM_SP_CLIENT_ID }}
          tenant-id: ${{ secrets.TEAM_SP_TENANT_ID }}
          subscription-id: ${{ secrets.TEAM_SP_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login -n ${{ inputs.ACR }}

      - name: Create docker image
        run: |
          docker build \
            --build-arg ENVIRONMENT=${{ inputs.ENV }} \
            -f ${{ inputs.DOCKERFILE }} \
            -t ${{ inputs.ACR }}.azurecr.io/${{ inputs.PROJECT_NAME }}/${{ inputs.IMAGE_NAME }}:${{ github.sha }}_${{ inputs.ENV }} \
            -t ${{ inputs.ACR }}.azurecr.io/${{ inputs.PROJECT_NAME }}/${{ inputs.IMAGE_NAME }}:${{ inputs.ENV }} \
            .

      - name: Push docker image to ACR
        run: |
          docker push -a ${{ inputs.ACR }}.azurecr.io/${{ inputs.PROJECT_NAME }}/${{ inputs.IMAGE_NAME }}

      - name: Ensure multiple revision mode
        run: |
          az containerapp revision set-mode \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --mode multiple

      - name: Deploy Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ inputs.ACR }}
          containerAppName: ${{ inputs.ACA }}
          resourceGroup: ${{ inputs.ACA_RESOURCE_GROUP }}
          imageToDeploy: ${{ inputs.ACR }}.azurecr.io/${{ inputs.PROJECT_NAME }}/${{ inputs.IMAGE_NAME }}:${{ github.sha }}_${{ inputs.ENV }}

      - name: Get latest revision name
        id: latestrev
        shell: bash
        run: |
          REVISION_NAME=$(az containerapp show \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --query properties.latestRevisionName \
            -o tsv)

          echo "revision_name=$REVISION_NAME" >> $GITHUB_OUTPUT
          echo "Latest revision: $REVISION_NAME"

      - name: Assign pilot label to latest revision
        if: ${{ inputs.DEPLOY_TO_PILOT }}
        run: |
          az containerapp revision label add \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --revision ${{ steps.latestrev.outputs.revision_name }} \
            --label pilot \
            --yes

      - name: Keep production traffic on main
        if: ${{ inputs.DEPLOY_TO_PILOT && !inputs.PROMOTE_TO_MAIN }}
        run: |
          az containerapp ingress traffic set \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --label-weight main=100 pilot=0

      - name: Promote pilot to main
        if: ${{ inputs.PROMOTE_TO_MAIN }}
        run: |
          az containerapp revision label add \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --revision ${{ steps.latestrev.outputs.revision_name }} \
            --label main \
            --yes

          az containerapp ingress traffic set \
            --name ${{ inputs.ACA }} \
            --resource-group ${{ inputs.ACA_RESOURCE_GROUP }} \
            --label-weight main=100
