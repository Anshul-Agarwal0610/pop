name: ACA – Deploy to Pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy as pilot (e.g. v2)"
        required: true
        default: "v2"
      app_message:
        description: "APP_MESSAGE env var for the revision"
        required: false
        default: "Pilot revision"

env:
  RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
  APP_NAME:       ${{ vars.ACA_APP_NAME }}
  ACR_NAME:       ${{ vars.ACR_NAME }}
  IMAGE_REPO:     ${{ vars.IMAGE_REPO }}   # e.g. demo-api

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name $ACR_NAME

      - name: Build & push
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ inputs.image_tag }}
          docker build -t $IMAGE ./demo
          docker push $IMAGE

  deploy-pilot:
    name: Deploy pilot revision
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy new revision
        run: |
          IMAGE=$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ inputs.image_tag }}
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $IMAGE \
            --set-env-vars \
              APP_VERSION=${{ inputs.image_tag }} \
              APP_MESSAGE="${{ inputs.app_message }}"

      - name: Label new revision as pilot
        run: |
          REVISION=$(az containerapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query properties.latestRevisionName \
            -o tsv)
          az containerapp revision label add \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --revision $REVISION \
            --label pilot
          echo "Pilot revision: $REVISION"
