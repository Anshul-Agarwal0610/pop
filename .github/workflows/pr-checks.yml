name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  detect-backend:
    name: Detect Backend
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for backend project
        id: check
        run: |
          if [ -f "Backend/BackendAPI/BackendAPI.csproj" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  frontend-build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install --legacy-peer-deps

      - name: Run lint
        working-directory: Frontend
        run: npm run lint

      - name: Run tests
        working-directory: Frontend
        run: npm test

      - name: Run build
        working-directory: Frontend
        run: npm run build

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: detect-backend
    if: needs.detect-backend.outputs.exists == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: Backend/BackendAPI
        run: dotnet restore

      - name: Build
        working-directory: Backend/BackendAPI
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: Backend/BackendAPI.Tests
        run: dotnet test --configuration Release

  mobile-checks:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm install
        working-directory: apps/mobile
      - run: npm run typecheck
        working-directory: apps/mobile
      - run: npm test
        working-directory: apps/mobile
