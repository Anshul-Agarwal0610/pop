name: ACA – Rollback Main

on:
  workflow_dispatch:
    inputs:
      revision_name:
        description: "Exact revision name to roll back to (leave blank to list available revisions)"
        required: false
      confirm:
        description: "Type 'yes' to confirm rollback"
        required: true
        default: "yes"

env:
  RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
  APP_NAME:       ${{ vars.ACA_APP_NAME }}

jobs:
  list-revisions:
    name: List available revisions
    runs-on: ubuntu-latest
    if: ${{ inputs.revision_name == '' }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Show revisions
        run: |
          echo "Available revisions (most recent first):"
          az containerapp revision list \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "[].{name:name, active:properties.active, created:properties.createdTime}" \
            --output table

  rollback:
    name: Roll back to specified revision
    runs-on: ubuntu-latest
    if: ${{ inputs.revision_name != '' }}
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "yes" ]; then
            echo "Confirmation not given. Aborting."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Activate revision if inactive
        run: |
          az containerapp revision activate \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --revision ${{ inputs.revision_name }} || true

      - name: Move 'main' label to target revision
        run: |
          az containerapp revision label add \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --revision ${{ inputs.revision_name }} \
            --label main
          echo "Rolled back: 'main' now points to ${{ inputs.revision_name }}"
